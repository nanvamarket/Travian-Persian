<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
<!-- Original emblem for the Persian server: a shield with a domed citadel and crossed spears. -->
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe08a"/><stop offset="0.5" stop-color="#e0a93b"/><stop offset="1" stop-color="#a8701c"/>
  </linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f6b4f"/><stop offset="1" stop-color="#173d2e"/>
  </linearGradient>
  <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7fd6cc"/><stop offset="1" stop-color="#2a8a86"/>
  </linearGradient>
</defs>
<!-- crossed spears behind the shield -->
<g stroke="#6b4a2b" stroke-width="4" stroke-linecap="round">
  <path d="M14 12 L106 124"/><path d="M106 12 L14 124"/>
</g>
<g fill="url(#gold)">
  <path d="M10 6 L22 12 L16 18 Z"/><path d="M110 6 L98 12 L104 18 Z"/>
</g>
<!-- shield -->
<path d="M60 8 L104 22 L104 64 C104 96 84 118 60 132 C36 118 16 96 16 64 L16 22 Z" fill="url(#gold)"/>
<path d="M60 16 L96 28 L96 64 C96 91 80 110 60 122 C40 110 24 91 24 64 L24 28 Z" fill="url(#field)"/>
<!-- citadel -->
<g>
  <path d="M60 36 C72 40 76 50 76 60 L44 60 C44 50 48 40 60 36 Z" fill="url(#dome)"/>
  <rect x="59" y="27" width="2" height="10" fill="#ffe08a"/>
  <circle cx="60" cy="26" r="3" fill="#ffe08a"/>
  <rect x="42" y="60" width="36" height="6" fill="#f3e3bd"/>
  <rect x="36" y="66" width="48" height="32" fill="#f3e3bd"/>
  <rect x="60" y="66" width="24" height="32" fill="#d9c08e"/>
  <rect x="30" y="56" width="10" height="42" fill="#efdcae"/>
  <path d="M28 57 L35 44 L42 57 Z" fill="#2a8a86"/>
  <rect x="80" y="56" width="10" height="42" fill="#d9c08e"/>
  <path d="M78 57 L85 44 L92 57 Z" fill="#1f6f73"/>
  <path d="M52 98 L52 82 Q60 70 68 82 L68 98 Z" fill="#3b2a1b"/>
  <path d="M49 98 L49 81 Q60 66 71 81 L71 98" fill="none" stroke="#ffe08a" stroke-width="2"/>
</g>
<!-- ground line -->
<path d="M30 98 L90 98" stroke="#ffe08a" stroke-width="2"/>
</svg>
